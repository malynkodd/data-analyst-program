<?xml version="1.0" encoding="utf-8"?>
<!--
  Набор значков приложения. Нарисован здесь, для этого репозитория:
  стороннего кода в файле нет, ничей лицензионный текст не переносился,
  права те же, что у остального репозитория. Внешних шрифтов и CDN
  приложение не использует (app/PLAN.md, раздел 1) — значок обязан
  работать без интернета, поэтому он лежит файлом, а не тянется ссылкой.

  Сетка 24×24, обводка 1.8, без заливки, цвет — currentColor: значок
  берёт цвет текста и потому не требует отдельной палитры на тему.
  Подключение: <svg class="ic"><use href="/static/icons.svg#i-check"/></svg>

  До этого статусы шага были юникодными знаками ✓ ▣ △ прямо в разметке:
  они не масштабируются вместе с текстом, рисуются разными шрифтами на
  разных машинах и не окрашиваются отдельно от строки.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <symbol id="i-check" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="4,12.5 9.5,18 20,6"/></g></symbol>

  <symbol id="i-play" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="7.5,4.5 19,12 7.5,19.5"/></g></symbol>

  <symbol id="i-pause" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
