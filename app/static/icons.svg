    <polyline points="7.4,9.6 10.4,12.6 7.4,15.6"/><line x1="13.2" y1="15.8" x2="17" y2="15.8"/></g></symbol>

  <symbol id="i-hand" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
