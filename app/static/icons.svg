    <line x1="12" y1="17.1" x2="12" y2="17.2"/></g></symbol>

  <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.8" cy="10.8" r="6.8"/><line x1="15.8" y1="15.8" x2="20.6" y2="20.6"/></g></symbol>

