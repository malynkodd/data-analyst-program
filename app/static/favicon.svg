<?xml version="1.0" encoding="utf-8"?>
<!--
  Значок вкладки. Нарисован здесь, как и `icons.svg`; стороннего кода нет.

  До него браузер запрашивал `/favicon.ico`, получал 404 на каждой
  загрузке страницы, и это была единственная ошибка в консоли приложения.

  Заливка сплошная, а не контур: на 16 пикселях тонкая обводка исчезает,
  и вкладка становится неотличима от любой другой. Галочка — то же, чем
  в интерфейсе помечен закрытый шаг.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#1f5f8b"/>
  <path d="M8.5 16.5 13.5 21.5 23.5 10.5" fill="none" stroke="#ffffff"
        stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
